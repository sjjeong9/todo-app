name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Railway CLI 설치
        run: npm install -g @railway/cli

      - name: Railway 배포
        run: railway up --detach --service todo-app
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
